services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.samuel.rule=Host(`samuelteescucha.com`)"
      - "traefik.http.routers.samuel.entrypoints=websecure"
      - "traefik.http.routers.samuel.tls=true"
      - "traefik.http.services.samuel.loadbalancer.server.port=80"
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
