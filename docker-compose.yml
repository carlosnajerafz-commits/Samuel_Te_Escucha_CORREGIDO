services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.samuel.rule=Host(`samuelteescucha.com`)"
      - "traefik.http.routers.samuel.entrypoints=websecure"
      - "traefik.http.routers.samuel.tls=true"
      - "traefik.http.services.samuel.loadbalancer.server.port=80"
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: tecamac
      POSTGRES_USER: tecamac_user
      POSTGRES_PASSWORD: tecamac_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: